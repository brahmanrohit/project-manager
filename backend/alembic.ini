[alembic]
script_location = alembic

# Put this directory on the import path so alembic/env.py can do
# `from app.config import settings`. Without it, running the alembic
# console script fails with ModuleNotFoundError: No module named 'app'.
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/ethara

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
